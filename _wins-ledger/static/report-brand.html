<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winnings Report</title>
<style>
:root{--bg:#0f1220;--panel:#171b2e;--line:#2d3350;--ink:#f1f3fb;--mute:#9aa3c7;--bulb:#ffcf5a;--ok:#49d17a;--bad:#ff5d7a;--warn:#f5b84a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px}
.wrap{max-width:1000px;margin:0 auto}
h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--mute);font-size:13px;margin:0 0 20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
input{font:600 15px/1 inherit;background:rgba(0,0,0,.35);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.field{flex:1;min-width:140px}
button{font:700 13px/1 inherit;background:var(--bulb);color:#241405;border:none;border-radius:8px;padding:10px 16px;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:4px}
th{text-align:left;color:var(--mute);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:top}
tr:hover td{background:rgba(255,255,255,.03)}
.err{color:var(--bad)}
.hint{color:var(--mute);font-size:12.5px;margin-top:8px}
.totals{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--mute)}
.totals b{color:var(--ink)}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.st{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;white-space:nowrap}
.st.pending{background:rgba(245,184,74,.15);color:var(--warn)}
.st.sent_to_risk{background:rgba(73,209,122,.15);color:var(--ok)}
.st.revoked{background:rgba(255,93,122,.15);color:var(--bad);text-decoration:line-through}
tr.revoked td{opacity:.55}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--mute)}
</style>
</head>
<body>
<div class="wrap" id="main">
  <h1 id="title">Winnings Report</h1>
  <p class="sub"><span id="subText">Every win recorded in the Wins Ledger for this brand in the selected range: who won, how much, and whether it has been sent to Risk.</span> <span class="live" id="liveTag"><span class="dot"></span>auto-updating</span></p>
  <div class="card">
    <div class="btnrow">
      <div class="field"><label for="from">From</label><input id="from" type="date"></div>
      <div class="field"><label for="to">To</label><input id="to" type="date"></div>
      <button id="loadBtn">Load</button>
      <button class="ghost" id="todayBtn" type="button">Today</button>
    </div>
  </div>
  <div class="card" id="resultCard">
    <p class="hint" id="status">Naglo-load…</p>
    <div class="totals" id="totals" hidden></div>
    <table id="tbl" hidden>
      <thead><tr><th>Time (PH)</th><th>Player</th><th>Game</th><th>Won</th><th>Status</th><th>Note</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <p class="hint" id="updatedAt"></p>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const PARTS=location.pathname.split("/").filter(Boolean); // report / <brand> / <token>
const BRAND=PARTS[1]||"",TOKEN=PARTS[2]||"";
const REFRESH_MS=30000;
const STATUS={pending:"Pending",sent_to_risk:"Sent to Risk",revoked:"Revoked"};
function peso(v){const n=Number(v||0);return "₱"+n.toLocaleString("en-PH",{minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2})}
function todayStr(){return new Date().toLocaleDateString("en-CA",{timeZone:"Asia/Manila"})}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

async function load(){
  const from=$("from").value||todayStr(),to=$("to").value||todayStr();
  $("status").textContent="Naglo-load…";$("status").className="hint";
  let r,j;
  try{r=await fetch("/api/report/"+encodeURIComponent(BRAND)+"/"+encodeURIComponent(TOKEN)+"?from="+encodeURIComponent(from)+"&to="+encodeURIComponent(to));j=await r.json().catch(()=>({}))}
  catch(e){$("status").textContent="Connection error.";$("status").className="hint err";return}
  if(!r.ok){$("tbl").hidden=true;$("totals").hidden=true;$("status").textContent=j.error||"Error";$("status").className="hint err";$("liveTag").hidden=true;return}
  const label=j.label||BRAND,game=j.game?" "+j.game:"";
  document.title=label+" — Winnings Report";$("title").textContent=label+game+" — Winnings Report";
  const wins=j.wins||[];
  if(!wins.length){$("tbl").hidden=true;$("totals").hidden=true;$("status").textContent="Walang panalo sa petsang ito.";$("status").className="hint";
    $("updatedAt").textContent="Last checked: "+new Date().toLocaleTimeString("en-PH",{timeZone:"Asia/Manila"});return}
  $("status").textContent="";
  const t=j.totals||{};
  $("totals").hidden=false;
  $("totals").innerHTML="<span><b>"+(t.players||0)+"</b> players</span><span><b>"+(t.wins||0)+"</b> wins</span><span><b>"+peso(t.amount)+"</b> total won</span>"+(t.revoked?"<span><b>"+t.revoked+"</b> revoked (not counted)</span>":"");
  $("tbody").innerHTML=wins.map(w=>{
    const when=new Date(Number(w.at)).toLocaleString("en-PH",{timeZone:"Asia/Manila",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
    const who=(w.player_name?esc(w.player_name):"")+(w.code?" <span class='mono'>"+esc(w.code)+"</span>":"");
    return "<tr class='"+w.status+"'><td>"+esc(when)+"</td><td>"+(who||"—")+"</td><td>"+esc(w.game)+"</td><td>"+peso(w.amount)+"</td><td><span class='st "+w.status+"'>"+(STATUS[w.status]||w.status)+"</span></td><td>"+esc(w.note||"")+"</td></tr>"}).join("");
  $("tbl").hidden=false;
  $("updatedAt").textContent="Last updated: "+new Date().toLocaleTimeString("en-PH",{timeZone:"Asia/Manila"});
}
$("loadBtn").onclick=load;
$("todayBtn").onclick=()=>{const t=todayStr();$("from").value=t;$("to").value=t;load()};
const t0=todayStr();$("from").value=t0;$("to").value=t0;
load();setInterval(load,REFRESH_MS);
</script>
</body>
</html>
